# Swift splash screen. Run:  dart run flutter_native_splash:create --path=flutter_native_splash.yaml
#
# The splash deliberately mirrors the launcher icon: the same all-white lockup
# on the same brand orange, so the icon you tap and the screen that follows are
# one continuous image rather than two different treatments.
flutter_native_splash:
  color: "#F1952C"
  image: assets/branding/splash/swift_splash_logo_mono.png
  color_dark: "#131314"
  image_dark: assets/branding/splash/swift_splash_logo_mono.png

  # Android 12+ masks splash artwork to a circle, so it gets the complete
  # app-icon composition rather than the wide lockup.
  android_12:
    color: "#F1952C"
    image: assets/branding/splash/swift_android12_splash.png
    color_dark: "#131314"
    image_dark: assets/branding/splash/swift_android12_splash.png

  android: true
  ios: true
  web: false
